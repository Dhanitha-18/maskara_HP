<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="color:red; background:white; position:fixed; top:0; left:0; z-index:9999; padding:20px; font-family:monospace; width:100%; white-space:pre-wrap;"><strong>Runtime Error:</strong><br/>' + e.message + '<br/>' + e.filename + ':' + e.lineno + ':' + e.colno + '<br/>' + (e.error ? e.error.stack : '') + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color:red; background:white; position:fixed; top:50%; left:0; z-index:9999; padding:20px; font-family:monospace; width:100%; white-space:pre-wrap;"><strong>Unhandled Promise Rejection:</strong><br/>' + (e.reason ? (e.reason.stack || e.reason) : 'Unknown') + '</div>';
      });
    </script>
  </body>
</html>
